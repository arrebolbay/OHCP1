# ==========================================
# OHCP - 农业病虫害智能问答助手 配置
# Online Pest & Herbicide Consultation Platform
# ==========================================

# 应用配置
spring.application.name=ohcp
server.port=8080
server.servlet.context-path=/

# H2 内嵌数据库配置
spring.datasource.url=jdbc:h2:file:./data/ohcp_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA 配置
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Jackson 序列化
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# 文件上传大小限制
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# 日志配置
logging.level.com.pestqa.ohcp=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Lucene 索引存储
ohcp.lucene.index-path=./data/lucene_index

# RAG 检索配置
ohcp.rag.top-k=5
ohcp.rag.rebuild-index-on-startup=true
